<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241710" />
      <stop offset="50%" stop-color="#180f0a" />
      <stop offset="100%" stop-color="#0e0805" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8be78" />
      <stop offset="50%" stop-color="#d98943" />
      <stop offset="100%" stop-color="#9a521e" />
    </linearGradient>
    <linearGradient id="cremaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73411b" />
      <stop offset="50%" stop-color="#552c10" />
      <stop offset="100%" stop-color="#341806" />
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#f0ddcc" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.35" />

  <!-- Outer Saucer ring -->
  <ellipse cx="256" cy="300" rx="160" ry="85" fill="#2d1c14" stroke="#4a2e1f" stroke-width="6" />

  <!-- Cup body outer rim -->
  <ellipse cx="256" cy="245" rx="126" ry="68" fill="#e8ded4" stroke="#c4b5a3" stroke-width="6" />
  <!-- Cup interior / Crema reservoir -->
  <ellipse cx="256" cy="245" rx="112" ry="58" fill="url(#cremaGrad)" />

  <!-- Latte Art Tulip / Heart -->
  <g fill="url(#foamGrad)" opacity="0.95">
    <!-- Heart top center -->
    <path d="M256,220 C242,196 216,198 216,218 C216,236 256,260 256,260 C256,260 296,236 296,218 C296,198 270,196 256,220 Z" />
    <!-- Tier 2 leaf -->
    <path d="M256,236 C238,222 208,226 214,244 C218,258 256,275 256,275 C256,275 294,258 298,244 C304,226 274,222 256,236 Z" opacity="0.9" />
    <!-- Tier 3 base -->
    <ellipse cx="256" cy="278" rx="20" ry="9" opacity="0.85" />
    <!-- Stem tip -->
    <line x1="256" y1="210" x2="256" y2="288" stroke="#341806" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />
  </g>

  <!-- Cup Handle -->
  <path d="M380,245 C416,245 425,290 376,305" fill="none" stroke="#e8ded4" stroke-width="18" stroke-linecap="round" />

  <!-- Steam wisps -->
  <path d="M220,165 C210,135 235,115 220,85" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.6" />
  <path d="M256,155 C266,125 246,105 256,75" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <path d="M292,165 C302,135 277,115 292,85" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.6" />

  <!-- Sparkle stars -->
  <circle cx="120" cy="140" r="4" fill="#f8be78" opacity="0.8" />
  <circle cx="390" cy="130" r="5" fill="#f8be78" opacity="0.9" />
  <circle cx="360" cy="380" r="3" fill="#f8be78" opacity="0.6" />
</svg>
